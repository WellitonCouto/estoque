<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JS Contadores — Sistema de Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#3b6ef8;--ac2:#2952d4;
  --mn:'IBM Plex Mono',monospace;--sn:'Geist',sans-serif;
  --tr:all .2s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sn);background:#0a0d14;color:#fff;font-size:15px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── TELA INICIAL ── */
#welcome-screen{display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;background:#0a0d14}
#welcome-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% -10%,rgba(59,110,248,.4) 0%,transparent 65%),radial-gradient(ellipse 60% 50% at 85% 110%,rgba(13,122,72,.25) 0%,transparent 55%),radial-gradient(ellipse 40% 40% at 10% 90%,rgba(109,40,217,.2) 0%,transparent 55%);pointer-events:none}
#welcome-screen::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.wc-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:560px;width:100%}
.wc-logo{display:flex;align-items:center;gap:13px;margin-bottom:52px;opacity:0;animation:wcFade .6s .1s forwards}
.wc-logo-ico{width:46px;height:46px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 8px 32px rgba(59,110,248,.55)}
.wc-logo span{font-size:13px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:.1em;text-transform:uppercase;font-family:var(--mn)}
.wc-greeting{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,.35);margin-bottom:12px;font-family:var(--mn);opacity:0;animation:wcFade .6s .25s forwards}
.wc-title{font-size:clamp(26px,4vw,42px);font-weight:700;color:#fff;text-align:center;line-height:1.15;letter-spacing:-.03em;margin-bottom:14px;opacity:0;animation:wcFade .7s .35s forwards}
.wc-title strong{background:linear-gradient(135deg,#7ba7fb,#a5c4fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.wc-sub{font-size:15px;color:rgba(255,255,255,.4);text-align:center;margin-bottom:48px;font-weight:400;opacity:0;animation:wcFade .7s .45s forwards}

/* ── BOTÃO ÚNICO PARA A NOVA APLICAÇÃO ── */
.wc-cta{display:flex;align-items:center;gap:20px;max-width:480px;width:100%;margin-bottom:40px;background:linear-gradient(135deg,rgba(59,110,248,.18),rgba(109,40,217,.14));border:1px solid rgba(123,167,251,.35);border-radius:22px;padding:26px 28px;cursor:pointer;text-decoration:none;transition:var(--tr);opacity:0;animation:wcSlide .6s .55s forwards;backdrop-filter:blur(12px)}
.wc-cta:hover{transform:translateY(-6px);border-color:rgba(123,167,251,.6);box-shadow:0 20px 56px rgba(0,0,0,.4)}
.wc-cta:active{transform:translateY(-2px)}
.wc-cta-ico{width:62px;height:62px;flex-shrink:0;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;background:rgba(59,110,248,.25);box-shadow:0 0 0 1px rgba(59,110,248,.45)}
.wc-cta-txt{flex:1;text-align:left}
.wc-cta-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.01em;margin-bottom:5px}
.wc-cta-desc{font-size:13px;color:rgba(255,255,255,.5);line-height:1.45}
.wc-cta-arrow{font-size:13px;color:rgba(255,255,255,.55);font-family:var(--mn);white-space:nowrap;transition:color .2s,transform .2s}
.wc-cta:hover .wc-cta-arrow{color:#fff;transform:translateX(4px)}

.wc-footer{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.15);font-family:var(--mn);letter-spacing:.06em;opacity:0;animation:wcFade .8s 1.1s forwards}
@keyframes wcFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes wcSlide{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.wc-cta{flex-direction:column;text-align:center}.wc-cta-txt{text-align:center}.wc-title{font-size:22px}}
</style>
</head>
